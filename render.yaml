services:
  - type: web
    name: money-vault
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATE_ROW_ID
        value: money-main
      - key: APP_TITLE
        value: Money Vault
      - key: ADMIN_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BANK_LINK_KEY        # 32 random bytes, base64 (openssl rand -base64 32). Encrypts linked-bank tokens.
        sync: false
      # optional providers (off unless set): TELLER_APP_ID, TELLER_ENV, TELLER_CERT, TELLER_KEY, PLAID_CLIENT_ID, PLAID_SECRET, PLAID_ENV
